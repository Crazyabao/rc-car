name: Build Android APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Install Android SDK
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq android-sdk

    - name: Set ANDROID_HOME
      run: echo "ANDROID_HOME=/usr/lib/android-sdk" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Debug - Show environment
      run: |
        echo "JAVA_HOME=$JAVA_HOME"
        echo "ANDROID_HOME=$ANDROID_HOME"
        java -version
        ls /usr/lib/android-sdk/platforms/
        cat android/app/build.gradle

    - name: Build Debug APK
      run: |
        cd android
        ./gradlew assembleDebug --stacktrace

    - name: List build outputs
      if: always()
      run: |
        echo "=== Build outputs ==="
        find android/app/build -name "*.apk" 2>/dev/null || echo "No APK found"
        ls -la android/app/build/outputs/apk/debug/ 2>/dev/null || echo "Debug dir not found"

    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
